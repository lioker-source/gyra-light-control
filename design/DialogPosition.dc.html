<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #131211; color: #ECE7DE; font-family: 'IBM Plex Sans',system-ui,-apple-system,sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E9A63F; } a:hover { color: #F8D9A0; }
  </style>
</helmet>

<div style="width:660px;height:620px;background:#131211;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:24px;">
  <div style="width:100%;background:#1C1A17;border:1px solid #4A443B;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;box-shadow:0 24px 60px #0009;">
    
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font:600 18px/1.3 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#ECE7DE;">Position 5</div>
      <div style="font:400 14px/1.5 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#A49B8C;">Ändert nur Name und Fadezeit. Die gespeicherte Position bleibt unverändert — der Kopf bewegt sich nicht.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font:400 11px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#6B6357;letter-spacing:.06em;">NAME</div>
      <div style="height:56px;border:1px solid #4A443B;background:#100F0D;border-radius:10px;display:flex;align-items:center;padding:0 16px;">
        <div style="font:500 16px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#ECE7DE;">Bar</div>
        <div style="width:2px;height:22px;background:#E9A63F;margin-left:2px;"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font:400 11px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#6B6357;letter-spacing:.06em;">FADEZEIT</div>
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="width:56px;height:56px;border:1px solid #4A443B;background:#232019;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 24px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#A49B8C;">−</div>
        <div style="flex-grow:1;height:56px;border:1px solid #4A443B;background:#100F0D;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;">
          <div style="font:600 22px/1 'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;color:#ECE7DE;">5.5</div>
          <div style="font:400 14px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#6B6357;">Sekunden</div>
        </div>
        <div style="width:56px;height:56px;border:1px solid #4A443B;background:#232019;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 24px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#A49B8C;">+</div>
      </div>
    </div>

    <div style="height:1px;background:#34302A;"></div>

    <div style="display:flex;gap:12px;">
      <div style="height:52px;padding:0 22px;border-radius:10px;border:1px solid #D6503C;background:#2A1712;color:#D6503C;display:flex;align-items:center;justify-content:center;">
      <div style="font:600 14px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;">Löschen</div>
    </div>
      <div style="flex-grow:1;"></div>
      <div style="height:52px;padding:0 22px;border-radius:10px;border:1px solid #4A443B;background:#232019;color:#A49B8C;display:flex;align-items:center;justify-content:center;">
      <div style="font:600 14px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;">Abbrechen</div>
    </div>
      <div style="height:52px;padding:0 22px;border-radius:10px;border:1px solid #E9A63F;background:#2A2013;color:#E9A63F;display:flex;align-items:center;justify-content:center;">
      <div style="font:600 14px/1 'IBM Plex Sans',system-ui,-apple-system,sans-serif;">Speichern</div>
    </div>
    </div>
    <div style="font:400 12px/1.5 'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#6B6357;">Position neu setzen: auf dem Live-Screen den Button lang drücken.</div>
  </div>
</div>
</x-dc>
</body>
</html>
