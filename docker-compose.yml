# Lokale Test-/Entwicklungsumgebung für Atrium Light.
# Startet MariaDB (mit Test-Patch), das Node-Backend, das PHP-Frontend
# und einen Art-Net-Monitor als Ersatz für echte DMX-Hardware.
#
#   cp .env.example .env      # ggf. ARTNET_HOST anpassen
#   docker compose up --build
#
#   Frontend:        http://localhost      (Port 80, per WEB_PORT aenderbar)
#   Art-Net-Monitor: http://localhost:8082
#   MariaDB:         localhost:3307  (user: gyra / pw: gyra)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-lichtsteuerung}
      MARIADB_USER: ${DB_USER:-gyra}
      MARIADB_PASSWORD: ${DB_PASSWORD:-gyra}
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      # schema.sql bleibt die maßgebliche Strukturdefinition.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.test.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-gyra}
      DB_PASSWORD: ${DB_PASSWORD:-gyra}
      DB_NAME: ${DB_NAME:-lichtsteuerung}
      WS_PORT: 8080
      TICK_HZ: ${TICK_HZ:-40}
      # Ziel der Art-Net-Ausgabe. Default: der Monitor-Container.
      # Für echte Hardware hier die IP des Nodes eintragen (siehe .env).
      ARTNET_HOST: ${ARTNET_HOST:-artnet-monitor}
      ARTNET_UNIVERSE: ${ARTNET_UNIVERSE:-0}
      # unicast (an ARTNET_HOST) oder broadcast (an ARTNET_BROADCAST_ADDR).
      ARTNET_MODE: ${ARTNET_MODE:-unicast}
      ARTNET_BROADCAST_ADDR: ${ARTNET_BROADCAST_ADDR:-255.255.255.255}
      ARTNET_SYNC: ${ARTNET_SYNC:-false}
      ARTNET_DISCOVERY: ${ARTNET_DISCOVERY:-true}
      ARTNET_PORT: ${ARTNET_PORT:-6454}
      ARTNET_SHORT_NAME: ${ARTNET_SHORT_NAME:-AtriumLight}
      ARTNET_LONG_NAME: ${ARTNET_LONG_NAME:-Atrium Light Server}
      # Bedienverhalten (Pad, Positionen, Zustands-Broadcast)
      PAD_SENSITIVITY: ${PAD_SENSITIVITY:-1.0}
      JOY_FULL_RANGE_SEC: ${JOY_FULL_RANGE_SEC:-2.0}
      ML_MOVE_TIMEOUT_MS: ${ML_MOVE_TIMEOUT_MS:-400}
      POSITION_SLOT_COUNT: ${POSITION_SLOT_COUNT:-9}
      POSITION_FADE_SEC: ${POSITION_FADE_SEC:-1.0}
      STATE_HZ: ${STATE_HZ:-10}
      STATE_KEEPALIVE_MS: ${STATE_KEEPALIVE_MS:-1000}
      WS_PING_INTERVAL_MS: ${WS_PING_INTERVAL_MS:-15000}
      # Diagnose
      DEBUG_WS_IN: ${DEBUG_WS_IN:-false}
      DEBUG_TICKS: ${DEBUG_TICKS:-false}
      DEBUG_ERRORS: ${DEBUG_ERRORS:-true}
    ports:
      # Host-Port aus LIGHT_WS_PORT: 8080 ist auf Rechnern mit grandMA3 onPC
      # belegt (dessen Web-Remote bindet 0.0.0.0:8080 und gewinnt gegen den
      # Dual-Stack-Socket von Docker). Der Container bleibt bei 8080.
      - "${LIGHT_WS_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: php:8.3-apache
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Host, den der Browser für die WebSocket-Verbindung nutzen soll.
      # Leer lassen = automatisch der Host aus der Browser-Adresszeile.
      LIGHT_WS_HOST: ${LIGHT_WS_HOST:-}
      LIGHT_WS_PORT: ${LIGHT_WS_PORT:-8080}
    ports:
      # Standard 80: das Pult ist dann einfach http://<Server-IP> ohne Port.
      # Ist 80 auf dem Rechner belegt, WEB_PORT in der .env setzen.
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./frontend:/var/www/html:ro

  # Optionaler HTTPS-Vorbau. Nur aktiv mit Profil "https":
  #   docker compose --profile https up -d
  # Sinn: Android installiert eine PWA nur ueber einen sicheren Ursprung als
  # echte App (Vollbild ohne Adressleiste). Details in ops/caddy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      # LAN-IP oder Hostname des Servers. Genau dieser Name muss am Tablet
      # in der Adresszeile stehen, sonst passt das Zertifikat nicht.
      # Kein Pflichtwert: docker compose loest auch Services auf, die gar
      # nicht im aktiven Profil liegen - ein ${...:?} hier wuerde den ganz
      # normalen Start ohne https kippen. Der Default localhost taugt zum
      # Ausprobieren, fuer das Tablet muss die LAN-IP in die .env.
      LIGHT_HOST: ${LIGHT_HOST:-localhost}
      # Zweiter Name im selben Zertifikat, ueblicherweise die LAN-IP. So
      # bleibt der alte Weg erreichbar, waehrend auf den Hostnamen
      # umgestellt wird. Muss sich von LIGHT_HOST unterscheiden.
      LIGHT_ALT_HOST: ${LIGHT_ALT_HOST:-127.0.0.1}
      # Zertifikat fuer Zugriffe ohne SNI (also ueber eine IP). Muss die IP
      # sein, unter der zugegriffen wird - start.sh waehlt sie passend.
      LIGHT_SNI: ${LIGHT_SNI:-127.0.0.1}
    ports:
      - "${HTTPS_PORT:-443}:443"
      # 80 nur uebernehmen, wenn das Frontend nicht schon dort liegt.
      # Sonst in der .env WEB_PORT=8081 setzen.
      - "${HTTPS_REDIRECT_PORT:-8880}:80"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Haelt die lokale CA fest. Ohne dieses Volume wird bei jedem Neustart
      # eine neue CA erzeugt und das Tablet muesste sie erneut vertrauen.
      - caddy-data:/data
      - caddy-config:/config

  artnet-monitor:
    image: node:22-alpine
    command: node /tools/artnet-monitor.js
    restart: unless-stopped
    environment:
      HTTP_PORT: 8082
    ports:
      - "${MONITOR_PORT:-8082}:8082"
    volumes:
      - ./tools:/tools:ro

volumes:
  db-data:
  caddy-data:
  caddy-config:
