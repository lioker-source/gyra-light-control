# Lokale Test-/Entwicklungsumgebung für Atrium Light.
# Startet MariaDB (mit Test-Patch), das Node-Backend, das PHP-Frontend
# und einen Art-Net-Monitor als Ersatz für echte DMX-Hardware.
#
#   cp .env.example .env      # ggf. ARTNET_HOST anpassen
#   docker compose up --build
#
#   Frontend:        http://localhost:8081
#   Art-Net-Monitor: http://localhost:8082
#   MariaDB:         localhost:3307  (user: gyra / pw: gyra)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lichtsteuerung
      MARIADB_USER: gyra
      MARIADB_PASSWORD: gyra
    ports:
      - "3307:3306"
    volumes:
      # schema.sql bleibt die maßgebliche Strukturdefinition.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.test.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: gyra
      DB_PASSWORD: gyra
      DB_NAME: lichtsteuerung
      WS_PORT: 8080
      TICK_HZ: ${TICK_HZ:-40}
      # Ziel der Art-Net-Ausgabe. Default: der Monitor-Container.
      # Für echte Hardware hier die IP des Nodes eintragen (siehe .env).
      ARTNET_HOST: ${ARTNET_HOST:-artnet-monitor}
      ARTNET_UNIVERSE: ${ARTNET_UNIVERSE:-0}
      DEBUG_WS_IN: ${DEBUG_WS_IN:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: php:8.3-apache
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Host, den der Browser für die WebSocket-Verbindung nutzen soll.
      # Leer lassen = automatisch der Host aus der Browser-Adresszeile.
      LIGHT_WS_HOST: ${LIGHT_WS_HOST:-}
      LIGHT_WS_PORT: ${LIGHT_WS_PORT:-8080}
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/var/www/html:ro

  artnet-monitor:
    image: node:22-alpine
    command: node /tools/artnet-monitor.js
    restart: unless-stopped
    environment:
      HTTP_PORT: 8082
    ports:
      - "8082:8082"
    volumes:
      - ./tools:/tools:ro

volumes:
  db-data:
